services:
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: tradevantage/worker:latest
    container_name: tradevantage-worker
    restart: unless-stopped
    env_file:
      - ../apps/worker/.env
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Liveness: container is considered unhealthy if no node process is running.
    # The worker runs via `tsx src/index.ts` which spawns a `node` process
    # with the tsx loader — match on `tsx` to catch it reliably.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'tsx' > /dev/null || pgrep -f 'node' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Resource limits — the worker is light (a few adapters/hour + grammY long poll).
    # Adjust upward if a future adapter does heavy local processing.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
