name: Deploy api

# Native-amd64 build on GitHub's runners (no QEMU, no laptop). Mirrors
# scripts/deploy-local.sh api: build apps/api/Dockerfile, push to the same GHCR
# tag Dokploy pulls, then hit the api deploy webhook. Worker and web have their
# own workflows (deploy-worker.yml, deploy-web.yml).
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rafieamandio/tradevantage-api:latest
            ghcr.io/rafieamandio/tradevantage-api:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The token in the path is the auth — same webhook scripts/deploy-local.sh
      # calls. Makes Dokploy pull :latest and redeploy the api app.
      - name: Trigger Dokploy redeploy
        run: curl -sf -X POST https://dashboard.tradevantage.gg/api/deploy/wXO5zIQKu-MVyO5dvn1To
