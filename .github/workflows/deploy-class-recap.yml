name: Deploy class recap

on:
  push:
    branches: [main]
    paths:
      - "apps/class-recap/**"
      - ".github/workflows/deploy-class-recap.yml"
  workflow_dispatch:

concurrency:
  group: deploy-class-recap
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/class-recap/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rafieamandio/addvantage/class-recap:latest
            ghcr.io/rafieamandio/addvantage/class-recap:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Same pattern as deploy-api.yml: the token in the path is the auth.
      - name: Trigger Dokploy redeploy
        run: curl -sf -X POST https://dashboard.tradevantage.gg/api/deploy/PaY_bSQkiGpv_nt7Y5eu_
