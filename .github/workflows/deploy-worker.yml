name: Deploy worker

# Native-amd64 build on GitHub's runners. Mirrors scripts/deploy-local.sh worker:
# build apps/worker/Dockerfile, push to the GHCR tag Dokploy pulls, then hit the
# worker deploy webhook. Same shape as deploy-api.yml / deploy-web.yml.

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/shared/**"
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rafieamandio/tradevantage-worker:latest
            ghcr.io/rafieamandio/tradevantage-worker:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply DB migrations (prod)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard on DB secret
        id: guard
        env:
          PROD_DIRECT_DB_URL: ${{ secrets.PROD_DIRECT_DB_URL }}
        run: |
          if [ -z "$PROD_DIRECT_DB_URL" ]; then
            echo "::warning::Skipping migrate — PROD_DIRECT_DB_URL secret not set. \
            Add it (Supabase session-mode connection, port 5432, NOT the 6543 pooler) to enable auto-migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Forward-only, idempotent: applies only migrations not yet in
      # _prisma_migrations. RLS ships inside the same migration files.
      - name: prisma migrate deploy
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_DB_URL }}
        run: pnpm exec prisma migrate deploy

  deploy:
    name: Trigger Dokploy
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The token in the path is the auth — same webhook scripts/deploy-local.sh
      # calls. Makes Dokploy pull :latest and redeploy the worker app.
      - name: Trigger Dokploy redeploy
        run: curl -sf -X POST https://dashboard.tradevantage.gg/api/deploy/meoxrO6zJCqXDPNtTxrbx
