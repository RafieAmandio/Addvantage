name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/shared/**"
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "infra/docker-compose.yml"
      - "infra/docker-compose.prod.yml"
      - "apps/worker/Dockerfile"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Compute image metadata
        run: |
          # Lowercase the org/repo because GHCR requires all-lowercase paths
          REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LC}/worker"
          SHA="${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply DB migrations (prod)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard on DB secret
        id: guard
        env:
          PROD_DIRECT_DB_URL: ${{ secrets.PROD_DIRECT_DB_URL }}
        run: |
          if [ -z "$PROD_DIRECT_DB_URL" ]; then
            echo "::warning::Skipping migrate — PROD_DIRECT_DB_URL secret not set. \
            Add it (Supabase session-mode connection, port 5432, NOT the 6543 pooler) to enable auto-migrations."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Forward-only, idempotent: applies only migrations not yet in
      # _prisma_migrations. RLS ships inside the same migration files.
      - name: prisma migrate deploy
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_DB_URL }}
        run: pnpm exec prisma migrate deploy

  deploy:
    name: Trigger Dokploy
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Same pattern as deploy-api.yml: the token in the path is the auth. Dokploy pulls
      # ghcr.io/rafieamandio/addvantage/worker:latest (the image built above) and restarts the worker.
      # The old SSH + compose step skipped on missing secrets, so the worker sat on its 2026-08-10 image.
      - name: Trigger Dokploy redeploy
        run: curl -sf -X POST https://dashboard.tradevantage.gg/api/deploy/meoxrO6zJCqXDPNtTxrbx
